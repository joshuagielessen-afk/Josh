<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Super Mario Bros</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #5c94fc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Press Start 2P', monospace;
      overflow: hidden;
    }
    #ui {
      color: white;
      font-size: 14px;
      display: flex;
      gap: 60px;
      margin-bottom: 10px;
      text-shadow: 2px 2px #000;
      letter-spacing: 1px;
    }
    canvas {
      border: 4px solid #000;
      image-rendering: pixelated;
      background: #5c94fc;
    }
    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      font-family: monospace;
      z-index: 10;
    }
    #overlay h1 {
      font-size: 48px;
      color: #ffd700;
      text-shadow: 3px 3px #c00;
      margin-bottom: 20px;
    }
    #overlay p { font-size: 18px; margin: 8px 0; color: #eee; }
    #overlay .controls { margin-top: 20px; font-size: 14px; color: #aef; line-height: 1.8; }
    #startBtn {
      margin-top: 30px;
      padding: 14px 40px;
      font-size: 20px;
      background: #e52521;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 2px;
      box-shadow: 0 4px #900;
    }
    #startBtn:hover { background: #ff3a36; transform: translateY(-2px); }
    #startBtn:active { transform: translateY(2px); box-shadow: 0 2px #900; }
    #gameOver, #winScreen {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      font-family: monospace;
      z-index: 10;
    }
    #gameOver h1 { font-size: 56px; color: #e52521; text-shadow: 3px 3px #000; }
    #winScreen h1 { font-size: 48px; color: #ffd700; text-shadow: 3px 3px #c00; }
    .restart-btn {
      margin-top: 20px;
      padding: 12px 32px;
      font-size: 18px;
      background: #e52521;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }
    .restart-btn:hover { background: #ff3a36; }
  </style>
</head>
<body>

<div id="ui">
  <span>MARIO</span>
  <span id="scoreDisplay">SCORE: 0</span>
  <span id="livesDisplay">LIVES: 3</span>
  <span id="coinsDisplay">COINS: 0</span>
</div>
<canvas id="gameCanvas" width="800" height="400"></canvas>

<div id="overlay">
  <h1>Super Mario</h1>
  <p>Jump on enemies to defeat them!</p>
  <p>Collect coins for points!</p>
  <div class="controls">
    <strong>Controls:</strong><br>
    ← → Arrow Keys / A D — Move<br>
    Space / ↑ / W — Jump<br>
    (Double Jump allowed!)
  </div>
  <button id="startBtn" onclick="startGame()">START GAME</button>
</div>

<div id="gameOver">
  <h1>GAME OVER</h1>
  <p style="font-size:20px;margin-top:10px;">Better luck next time!</p>
  <button class="restart-btn" onclick="restartGame()">Try Again</button>
</div>

<div id="winScreen">
  <h1>YOU WIN! 🎉</h1>
  <p style="font-size:20px;margin-top:10px;color:#aef;">Congratulations!</p>
  <button class="restart-btn" onclick="restartGame()">Play Again</button>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const W = canvas.width;
const H = canvas.height;
const GRAVITY = 0.45;
const JUMP_FORCE = -11;

let score = 0, lives = 3, coins = 0;
let gameRunning = false;
let cameraX = 0;
const WORLD_WIDTH = 3200;

// ── Colours (pixel-art palette) ─────────────────────────────
const C = {
  sky: '#5c94fc',
  ground: '#c84b11',
  groundTop: '#9bbc0f',
  brick: '#c84b11',
  brickLine: '#8b3a0f',
  questionBlock: '#f0a000',
  qbEdge: '#c07800',
  coin: '#ffd700',
  mario: '#e52521',
  marioSkin: '#fab03c',
  enemy: '#8b1a1a',
  enemyFeet: '#5a0f0f',
  flag: '#ffffff',
  flagPole: '#888',
  pipe: '#00a800',
  pipeDark: '#006400',
  cloud: '#ffffff',
  hill: '#00a800',
};

// ── Platform / World Data ────────────────────────────────────
const TILE = 32;

function makePlatforms() {
  const p = [];
  // Ground row
  for (let x = 0; x < WORLD_WIDTH; x += TILE) {
    // Gap in ground
    if (x >= 640 && x < 704) continue;
    if (x >= 1472 && x < 1536) continue;
    p.push({ x, y: H - TILE, w: TILE, h: TILE, type: 'ground' });
  }
  // Floating platforms
  const floaters = [
    [160,  H-128, 3], [352, H-160, 2], [480, H-192, 3],
    [768,  H-128, 2], [832, H-160, 2], [960, H-128, 4],
    [1152, H-160, 3], [1280,H-192, 2], [1408,H-128, 3],
    [1600, H-160, 4], [1728,H-128, 2], [1856,H-192, 3],
    [2048, H-128, 3], [2176,H-160, 2], [2304,H-128, 4],
    [2496, H-192, 3], [2624,H-128, 2], [2752,H-160, 3],
    [2944, H-128, 4],
  ];
  floaters.forEach(([x, y, n]) => {
    for (let i = 0; i < n; i++) p.push({ x: x + i * TILE, y, w: TILE, h: TILE, type: 'brick' });
  });
  return p;
}

function makeQuestionBlocks() {
  const positions = [
    [192, H-160], [384, H-192], [512, H-224],
    [800, H-192], [1024, H-192], [1184, H-192],
    [1312, H-224], [1664, H-192], [1760, H-192],
    [2080, H-192], [2208, H-192], [2336, H-192],
    [2528, H-224], [2656, H-192], [2784, H-192],
  ];
  return positions.map(([x, y]) => ({ x, y, w: TILE, h: TILE, hit: false, coinTimer: 0 }));
}

function makePipes() {
  return [
    { x: 320, y: H - TILE * 3, w: TILE * 2, h: TILE * 2 },
    { x: 704, y: H - TILE * 3, w: TILE * 2, h: TILE * 2 },
    { x: 1216,y: H - TILE * 4, w: TILE * 2, h: TILE * 3 },
    { x: 1760,y: H - TILE * 3, w: TILE * 2, h: TILE * 2 },
    { x: 2240,y: H - TILE * 4, w: TILE * 2, h: TILE * 3 },
    { x: 2688,y: H - TILE * 3, w: TILE * 2, h: TILE * 2 },
  ];
}

function makeEnemies() {
  const xs = [280, 560, 840, 1100, 1380, 1640, 1900, 2100, 2380, 2600, 2850, 3050];
  return xs.map(x => ({
    x, y: H - TILE * 2,
    w: TILE, h: TILE,
    vx: -1.2, vy: 0,
    alive: true, dying: false, dyingTimer: 0,
  }));
}

function makeCoins() {
  const positions = [
    [192,H-192],[224,H-192],[384,H-224],[416,H-224],
    [800,H-224],[1024,H-224],[1312,H-256],[1664,H-224],
    [1760,H-224],[2080,H-224],[2208,H-224],[2336,H-224],
    [2528,H-256],[2656,H-224],[2784,H-224],
  ];
  return positions.map(([x, y]) => ({ x: x+8, y: y-8, w: 16, h: 20, collected: false, bobY: 0, bobT: Math.random()*Math.PI*2 }));
}

let platforms, qBlocks, pipes, enemies, coinItems, flagReached;
let mario, keys, particles;

function initWorld() {
  platforms  = makePlatforms();
  qBlocks    = makeQuestionBlocks();
  pipes      = makePipes();
  enemies    = makeEnemies();
  coinItems  = makeCoins();
  flagReached = false;
  particles  = [];

  mario = {
    x: 80, y: H - TILE * 2,
    w: 26, h: 30,
    vx: 0, vy: 0,
    onGround: false,
    jumpsLeft: 2,
    facing: 1,
    animFrame: 0,
    animTimer: 0,
    invincible: 0,
  };

  cameraX = 0;
  score = 0; coins = 0; lives = 3;
  updateUI();
}

function updateUI() {
  document.getElementById('scoreDisplay').textContent = 'SCORE: ' + score;
  document.getElementById('livesDisplay').textContent = 'LIVES: ' + lives;
  document.getElementById('coinsDisplay').textContent = 'COINS: ' + coins;
}

// ── Input ────────────────────────────────────────────────────
keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space','ArrowUp','KeyW'].includes(e.code) && gameRunning) {
    e.preventDefault();
    if (mario.jumpsLeft > 0) {
      mario.vy = JUMP_FORCE;
      mario.jumpsLeft--;
      spawnParticles(mario.x + mario.w/2, mario.y + mario.h, '#fff', 4);
    }
  }
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// ── Particles ────────────────────────────────────────────────
function spawnParticles(x, y, color, n = 8) {
  for (let i = 0; i < n; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 3;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 2,
      life: 30 + Math.random() * 20,
      maxLife: 50,
      color,
      size: 4 + Math.random() * 4,
    });
  }
}

// ── AABB ─────────────────────────────────────────────────────
function overlaps(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x &&
         a.y < b.y + b.h && a.y + a.h > b.y;
}

// ── Physics helpers ──────────────────────────────────────────
function resolveVsRects(entity, rects) {
  for (const r of rects) {
    if (!overlaps(entity, r)) continue;
    const dx = (entity.x + entity.w/2) - (r.x + r.w/2);
    const dy = (entity.y + entity.h/2) - (r.y + r.h/2);
    const ox = entity.w/2 + r.w/2 - Math.abs(dx);
    const oy = entity.h/2 + r.h/2 - Math.abs(dy);
    if (ox < oy) {
      entity.x += dx > 0 ? ox : -ox;
      entity.vx = 0;
    } else {
      entity.y += dy > 0 ? oy : -oy;
      if (dy < 0) { entity.onGround = true; entity.jumpsLeft = 2; }
      entity.vy = 0;
    }
  }
}

// ── Update ───────────────────────────────────────────────────
function update() {
  if (!gameRunning) return;

  // Mario movement
  const spd = 4.5;
  if (keys['ArrowLeft'] || keys['KeyA'])  { mario.vx = -spd; mario.facing = -1; }
  else if (keys['ArrowRight'] || keys['KeyD']) { mario.vx = spd;  mario.facing = 1; }
  else mario.vx *= 0.8;

  mario.vy += GRAVITY;
  mario.x  += mario.vx;
  mario.y  += mario.vy;
  mario.onGround = false;

  // Clamp world
  if (mario.x < 0) { mario.x = 0; mario.vx = 0; }
  if (mario.x + mario.w > WORLD_WIDTH) mario.x = WORLD_WIDTH - mario.w;

  // Collision with platforms
  resolveVsRects(mario, platforms);

  // Collision with pipes
  resolveVsRects(mario, pipes);

  // Collision with question blocks
  for (const qb of qBlocks) {
    if (!overlaps(mario, qb)) continue;
    const dy = (mario.y + mario.h/2) - (qb.y + qb.h/2);
    const oy = mario.h/2 + qb.h/2 - Math.abs(dy);
    const dx = (mario.x + mario.w/2) - (qb.x + qb.w/2);
    const ox = mario.w/2 + qb.w/2 - Math.abs(dx);
    if (oy < ox) {
      mario.y += dy > 0 ? oy : -oy;
      if (dy < 0 && !qb.hit) {
        // Hit from below
        qb.hit = true;
        qb.coinTimer = 15;
        score += 100;
        coins++;
        spawnParticles(qb.x + qb.w/2, qb.y, C.coin, 6);
        updateUI();
      }
      if (dy > 0) { mario.onGround = true; mario.jumpsLeft = 2; }
      mario.vy = 0;
    } else {
      mario.x += dx > 0 ? ox : -ox;
      mario.vx = 0;
    }
  }
  for (const qb of qBlocks) {
    if (qb.coinTimer > 0) qb.coinTimer--;
  }

  // Fall into pit
  if (mario.y > H + 60) {
    loseLife();
    return;
  }

  // Camera
  cameraX = mario.x - W / 3;
  cameraX = Math.max(0, Math.min(cameraX, WORLD_WIDTH - W));

  // Enemies
  for (const e of enemies) {
    if (!e.alive) continue;
    if (e.dying) {
      e.dyingTimer--;
      if (e.dyingTimer <= 0) e.alive = false;
      continue;
    }

    e.vy += GRAVITY;
    e.x  += e.vx;
    e.y  += e.vy;
    e.onGround = false;

    // Enemy vs platforms & pipes
    const tmpE = { ...e };
    resolveVsRects(tmpE, platforms);
    resolveVsRects(tmpE, pipes);
    e.x = tmpE.x; e.y = tmpE.y;
    e.vx = tmpE.vx; e.vy = tmpE.vy;
    if (tmpE.onGround) e.onGround = true;

    // Turn at edges
    if (e.onGround) {
      const ahead = { x: e.x + e.vx * 10 - 2, y: e.y + e.h, w: e.w + 4, h: 4 };
      let hasFloor = false;
      for (const p of platforms) { if (overlaps(ahead, p)) { hasFloor = true; break; } }
      if (!hasFloor) e.vx *= -1;
    }

    // Boundary
    if (e.x < 0 || e.x + e.w > WORLD_WIDTH) e.vx *= -1;

    // Mario stomps enemy
    if (mario.invincible <= 0 && overlaps(mario, e)) {
      const mBottom = mario.y + mario.h;
      const eTop    = e.y;
      if (mario.vy > 0 && mBottom - mario.vy <= eTop + 4) {
        // Stomp
        e.dying = true; e.dyingTimer = 20;
        mario.vy = JUMP_FORCE * 0.6;
        mario.jumpsLeft = 2;
        score += 200;
        spawnParticles(e.x + e.w/2, e.y + e.h/2, '#f55', 10);
        updateUI();
      } else {
        // Hit by enemy
        loseLife();
        return;
      }
    }
  }

  // Coin collection
  for (const c of coinItems) {
    if (c.collected) continue;
    c.bobT += 0.05;
    c.bobY = Math.sin(c.bobT) * 4;
    const cr = { x: c.x, y: c.y + c.bobY, w: c.w, h: c.h };
    if (overlaps(mario, cr)) {
      c.collected = true;
      score += 100; coins++;
      spawnParticles(c.x + c.w/2, c.y, C.coin, 6);
      updateUI();
    }
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.2;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // Invincibility
  if (mario.invincible > 0) mario.invincible--;

  // Mario animation
  mario.animTimer++;
  if (mario.animTimer > 6) { mario.animTimer = 0; mario.animFrame = (mario.animFrame + 1) % 3; }

  // Flag / goal
  const flagX = WORLD_WIDTH - 80;
  if (mario.x > flagX && !flagReached) {
    flagReached = true;
    score += 1000;
    updateUI();
    setTimeout(() => {
      gameRunning = false;
      document.getElementById('winScreen').style.display = 'flex';
    }, 800);
  }
}

function loseLife() {
  lives--;
  updateUI();
  mario.invincible = 120;
  spawnParticles(mario.x + mario.w/2, mario.y + mario.h/2, C.mario, 14);
  if (lives <= 0) {
    gameRunning = false;
    setTimeout(() => { document.getElementById('gameOver').style.display = 'flex'; }, 500);
  } else {
    mario.x = Math.max(cameraX + 60, 80);
    mario.y = H - TILE * 4;
    mario.vx = 0; mario.vy = 0;
  }
}

// ── Draw helpers ─────────────────────────────────────────────
function drawRect(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x - cameraX, y, w, h);
}

function drawCloud(x, y) {
  const cx = x - cameraX;
  ctx.fillStyle = C.cloud;
  ctx.fillRect(cx + 10, y + 10, 40, 20);
  ctx.fillRect(cx + 0,  y + 20, 60, 20);
  ctx.fillRect(cx + 15, y + 4,  30, 15);
}

function drawHill(x, y, r) {
  const cx = x - cameraX;
  ctx.fillStyle = C.hill;
  ctx.beginPath();
  ctx.arc(cx, y, r, Math.PI, 0);
  ctx.fill();
  ctx.fillStyle = '#00c000';
  ctx.beginPath();
  ctx.arc(cx, y, r, Math.PI, 0);
  ctx.fill();
}

function drawGround(p) {
  const px = p.x - cameraX;
  if (px > W || px + p.w < 0) return;
  ctx.fillStyle = C.groundTop;
  ctx.fillRect(px, p.y, p.w, 8);
  ctx.fillStyle = C.ground;
  ctx.fillRect(px, p.y + 8, p.w, p.h - 8);
  ctx.fillStyle = C.brickLine;
  ctx.fillRect(px, p.y + 8, p.w, 1);
}

function drawBrick(p) {
  const px = p.x - cameraX;
  if (px > W || px + p.w < 0) return;
  ctx.fillStyle = C.brick;
  ctx.fillRect(px, p.y, p.w, p.h);
  ctx.fillStyle = C.brickLine;
  ctx.fillRect(px, p.y + p.h/2, p.w, 2);
  ctx.fillRect(px + p.w/2, p.y, 2, p.h/2);
  ctx.fillRect(px, p.y, p.w, 2);
  ctx.fillRect(px, p.y, 2, p.h);
  ctx.fillRect(px + p.w - 2, p.y, 2, p.h);
}

function drawQBlock(qb) {
  const px = qb.x - cameraX;
  if (px > W || px + qb.w < 0) return;
  const c = qb.hit ? '#888' : C.questionBlock;
  ctx.fillStyle = c;
  ctx.fillRect(px, qb.y, qb.w, qb.h);
  ctx.fillStyle = qb.hit ? '#666' : C.qbEdge;
  ctx.fillRect(px, qb.y, qb.w, 4);
  ctx.fillRect(px, qb.y + qb.h - 4, qb.w, 4);
  ctx.fillRect(px, qb.y, 4, qb.h);
  ctx.fillRect(px + qb.w - 4, qb.y, 4, qb.h);
  if (!qb.hit) {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 18px monospace';
    ctx.fillText('?', px + 10, qb.y + 22);
  }
  // Coin pop
  if (qb.coinTimer > 0) {
    const rise = (15 - qb.coinTimer) * 2;
    ctx.fillStyle = C.coin;
    ctx.fillRect(px + 12, qb.y - 10 - rise, 8, 12);
    ctx.fillStyle = '#ffa500';
    ctx.fillRect(px + 13, qb.y - 9 - rise, 6, 10);
  }
}

function drawPipe(pipe) {
  const px = pipe.x - cameraX;
  if (px > W || px + pipe.w < 0) return;
  // Body
  ctx.fillStyle = C.pipe;
  ctx.fillRect(px + 4, pipe.y + TILE, pipe.w - 8, pipe.h - TILE);
  // Cap
  ctx.fillStyle = C.pipe;
  ctx.fillRect(px, pipe.y, pipe.w, TILE);
  // Highlights
  ctx.fillStyle = C.pipeDark;
  ctx.fillRect(px + 4, pipe.y + TILE, 4, pipe.h - TILE);
  ctx.fillRect(px, pipe.y, 4, TILE);
}

function drawMario() {
  const px = mario.x - cameraX;
  const py = mario.y;
  const alpha = mario.invincible > 0 ? (Math.floor(mario.invincible / 4) % 2 === 0 ? 0.4 : 1) : 1;
  ctx.globalAlpha = alpha;
  const flip = mario.facing === -1;
  ctx.save();
  if (flip) { ctx.scale(-1, 1); }
  const bx = flip ? -(px + mario.w) : px;

  // Hat
  ctx.fillStyle = C.mario;
  ctx.fillRect(bx + 4, py + 2, 18, 6);
  ctx.fillRect(bx + 2, py + 8, 22, 4);
  // Face
  ctx.fillStyle = C.marioSkin;
  ctx.fillRect(bx + 4, py + 12, 18, 10);
  // Eyes
  ctx.fillStyle = '#000';
  ctx.fillRect(bx + 16, py + 14, 3, 3);
  // Mustache
  ctx.fillStyle = '#6b3a0f';
  ctx.fillRect(bx + 10, py + 18, 12, 3);
  // Body
  ctx.fillStyle = C.mario;
  ctx.fillRect(bx + 4, py + 22, 18, 8);
  // Overalls
  ctx.fillStyle = '#1a5fcc';
  ctx.fillRect(bx + 6, py + 22, 14, 8);
  // Legs animation
  const legOffset = mario.onGround ? Math.abs(mario.vx) > 0.5 ? [Math.sin(mario.animFrame * 2) * 4, -Math.sin(mario.animFrame * 2) * 4] : [0, 0] : [4, -4];
  ctx.fillStyle = C.mario;
  ctx.fillRect(bx + 4,  py + 30 + legOffset[0], 8, 6);
  ctx.fillRect(bx + 14, py + 30 + legOffset[1], 8, 6);
  // Shoes
  ctx.fillStyle = '#3d1c00';
  ctx.fillRect(bx + 2,  py + 34 + legOffset[0], 10, 4);
  ctx.fillRect(bx + 12, py + 34 + legOffset[1], 10, 4);

  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawEnemy(e) {
  const px = e.x - cameraX;
  if (px > W + TILE || px < -TILE) return;
  if (e.dying) {
    // Squished
    ctx.fillStyle = e.color || C.enemy;
    ctx.fillStyle = C.enemy;
    ctx.fillRect(px, e.y + e.h - 10, e.w, 10);
    ctx.fillStyle = C.enemyFeet;
    ctx.fillRect(px, e.y + e.h - 6, e.w, 6);
    return;
  }
  // Body
  ctx.fillStyle = C.enemy;
  ctx.fillRect(px + 2, e.y + 8, e.w - 4, e.h - 8);
  // Head (bigger, mushroom shape)
  ctx.fillStyle = '#c0392b';
  ctx.fillRect(px, e.y, e.w, 16);
  // Spots
  ctx.fillStyle = '#fff';
  ctx.fillRect(px + 4, e.y + 3, 5, 5);
  ctx.fillRect(px + 17, e.y + 3, 5, 5);
  // Eyes
  ctx.fillStyle = '#fff';
  ctx.fillRect(px + 5, e.y + 9, 6, 5);
  ctx.fillRect(px + 15, e.y + 9, 6, 5);
  ctx.fillStyle = '#000';
  ctx.fillRect(px + 6,  e.y + 10, 3, 3);
  ctx.fillRect(px + 16, e.y + 10, 3, 3);
  // Feet
  const footBob = Math.sin(Date.now() / 100) * 2;
  ctx.fillStyle = C.enemyFeet;
  ctx.fillRect(px + 2, e.y + e.h - 8, 10, 8 + footBob);
  ctx.fillRect(px + e.w - 12, e.y + e.h - 8, 10, 8 - footBob);
}

function drawCoin(c) {
  if (c.collected) return;
  const px = c.x - cameraX;
  if (px > W || px < -20) return;
  const py = c.y + c.bobY;
  ctx.fillStyle = C.coin;
  ctx.fillRect(px, py, c.w, c.h);
  ctx.fillStyle = '#ffa500';
  ctx.fillRect(px + 2, py + 2, c.w - 4, c.h - 4);
  ctx.fillStyle = '#ffd700';
  ctx.fillRect(px + 4, py + 3, 5, c.h - 6);
}

function drawFlag() {
  const fx = WORLD_WIDTH - 80 - cameraX;
  // Pole
  ctx.fillStyle = C.flagPole;
  ctx.fillRect(fx, H - TILE * 6, 4, TILE * 5);
  // Flag
  ctx.fillStyle = '#e52521';
  ctx.fillRect(fx + 4, H - TILE * 6, 24, 16);
  ctx.fillStyle = '#fff';
  ctx.fillRect(fx + 8, H - TILE * 6 + 3, 10, 10);
  // Castle base
  ctx.fillStyle = '#888';
  for (let i = 0; i < 5; i++) {
    ctx.fillRect(fx + 10 + i * 14, H - TILE * 4, 12, TILE * 3);
  }
  ctx.fillStyle = '#aaa';
  for (let i = 0; i < 4; i++) {
    ctx.fillRect(fx + 17 + i * 14, H - TILE * 4 - 10, 8, 10);
  }
}

function drawParticles() {
  for (const p of particles) {
    const alpha = p.life / p.maxLife;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - cameraX - p.size/2, p.y - p.size/2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

// ── Background decorations ───────────────────────────────────
const clouds = [100,300,600,950,1250,1600,1900,2200,2550,2850].map((x,i)=>({x, y: 40+i%3*30}));
const hills  = [200,700,1300,1800,2400,2900].map((x,i)=>({x, r: 60+i%3*20, y: H-TILE}));

function drawBackground() {
  ctx.fillStyle = C.sky;
  ctx.fillRect(0, 0, W, H);

  // Hills
  for (const h of hills) {
    const hx = h.x - cameraX;
    if (hx > W + h.r || hx < -h.r) continue;
    ctx.fillStyle = '#00a800';
    ctx.beginPath(); ctx.arc(hx, h.y, h.r, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#00c000';
    ctx.beginPath(); ctx.arc(hx, h.y, h.r - 6, Math.PI, 0); ctx.fill();
  }

  // Clouds
  for (const cl of clouds) {
    const cx = cl.x - cameraX * 0.4; // parallax
    if (cx > W + 80 || cx < -80) continue;
    ctx.fillStyle = '#fff';
    ctx.fillRect(cx + 10, cl.y + 10, 40, 20);
    ctx.fillRect(cx,      cl.y + 20, 60, 20);
    ctx.fillRect(cx + 15, cl.y + 4,  30, 15);
  }
}

// ── Main render ──────────────────────────────────────────────
function render() {
  ctx.clearRect(0, 0, W, H);
  drawBackground();

  for (const p of platforms) {
    if (p.type === 'ground') drawGround(p);
    else drawBrick(p);
  }
  for (const qb of qBlocks) drawQBlock(qb);
  for (const pipe of pipes) drawPipe(pipe);
  for (const c of coinItems) drawCoin(c);
  for (const e of enemies) { if (e.alive) drawEnemy(e); }

  drawFlag();
  drawMario();
  drawParticles();
}

// ── Game Loop ────────────────────────────────────────────────
function gameLoop() {
  update();
  render();
  if (gameRunning) requestAnimationFrame(gameLoop);
}

function startGame() {
  document.getElementById('overlay').style.display = 'none';
  initWorld();
  gameRunning = true;
  gameLoop();
}

function restartGame() {
  document.getElementById('gameOver').style.display = 'none';
  document.getElementById('winScreen').style.display = 'none';
  initWorld();
  gameRunning = true;
  gameLoop();
}
</script>
</body>
